<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Point</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header class="top">
        <div class="logo">
            🟡 Play Point
        </div>

        <div class="points">
            🪙 <span id="points">0</span>
        </div>
    </header>


    <section class="profile">
        <h3>Play Point</h3>
        <p>ID: <span id="userid">0</span></p>
    </section>


    <section class="coin-box">

        <h2>Level 1</h2>

        <div class="coin">
            P
        </div>

        <div class="energy">
            ⚡ Energy
            <div class="bar">
                <div class="fill"></div>
            </div>
            <small>100 / 100</small>
        </div>

    </section>


    <section class="card reward">

        🎁 Daily Reward

        <button>
            Claim Reward
        </button>

    </section>


</div>


<nav class="menu">

<button>🏠<br>Home</button>
<button>📋<br>Tasks</button>
<button>🎁<br>Reward</button>
<button>🛒<br>Shop</button>
<button>👥<br>Friends</button>
<button>👤<br>Profile</button>

</nav>


<script src="app.js"></script>

</body>
</html>
